[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.19.0",
    "azure-mgmt-costmanagement>=4.0.1",
    # <26: 26.0.0 dropped the top-level `from azure.mgmt.resource import
    # ResourceManagementClient` rollup (collectors/resources.py). Lift the cap
    # once that import moves to `azure.mgmt.resource.resources`.
    "azure-mgmt-resource>=26.0.0,<27",
    "azure-mgmt-billing>=6.0.0",
    "google-auth>=2.30.0",
    "google-cloud-asset>=3.27.0",
    "google-cloud-bigquery>=3.25.0",
    "boto3>=1.35.0",
    "click>=8.1.8",
    "jinja2>=3.1.5",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "openpyxl>=3.1",
    "anthropic>=0.115.0",
]

[project.scripts]
finops = "finops.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
finops = ["reporters/templates/*.j2"]
